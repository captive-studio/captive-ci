name: Expo CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      slack-webhook-url:
        required: false

      expo-token:
        required: false

      sentry-auth-token:
        required: false

    inputs:
      working-directory:
        description: "Dossier du projet Expo dans le dépôt (package.json, package-lock.json), pour un monorepo où l'app n'est pas à la racine."
        required: false
        type: string
        default: "."

      node-image:
        description: "Image CI prééquipée avec Node, npm, Git, tar, gzip et zstd."
        required: false
        type: string
        # renovate: datasource=docker depName=ghcr.io/captive-studio/node-ci
        default: ghcr.io/captive-studio/node-ci:26.13.0@sha256:e0bcbb2e4173c804879e01b0701f2412c451bcd8693f905b930f6fee708b5ef8

      lint-command:
        required: false
        type: string
        default: npm run lint

      typecheck-command:
        required: false
        type: string
        default: npm run typecheck

      test-command:
        required: false
        type: string
        default: npm run test

      format-check-command:
        required: false
        type: string
        default: npm run format:check

      health-command:
        required: false
        type: string
        default: ""

      quality-command:
        description: "Lance code-multivitals et écrit son rapport JSON dans code-multivitals.json (dossier de travail). Le seuil est minimumHealthScore dans .code-multivitals.json. Vide : pas d'analyse."
        required: false
        type: string
        default: ""

      jest-cache-path:
        required: false
        type: string
        default: .jest-cache

      install-command:
        required: false
        type: string
        default: npm ci --strict-peer-deps

      extra-cache-paths:
        required: false
        type: string
        default: ""

      audit-command:
        required: false
        type: string
        default: npx audit-ci --moderate

      use-eas-update:
        required: false
        type: boolean
        default: false

      eas-channel:
        required: false
        type: string
        default: staging

      eas-environment:
        required: false
        type: string
        default: preview

      expo-public-app-env:
        required: false
        type: string
        default: staging

      eas-update-commit-prefix:
        required: false
        type: string
        default: "🔖 Set version"

jobs:
  build:
    if: github.ref_type == 'branch'
    # captive-small et non self-hosted : ce job fait un checkout et un `npm ci`, il ne
    # construit aucune image et n'appelle jamais le daemon Docker partagé. Le pool
    # `self-hosted` est la ressource rare du cluster (maxRunners 14, contre 22 pour
    # captive-small, plafond cumulé volontairement borné par l'espace disque de r8x) :
    # le réserver aux jobs qui buildent des images. Les limites CPU/mémoire du pod runner
    # ne bornent pas le job, qui s'exécute dans un conteneur enfant du dind du nœud ; ce
    # sont des jetons de quota d'ordonnancement, pas un budget d'exécution.
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Un seul producteur ; les consommateurs restaurent sans republier le cache.
      # Clé exacte uniquement : npm ci efface node_modules avant installation,
      # donc restaurer une archive d'un autre lockfile coûte du temps pour rien.
      - name: Save npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-image }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

  source_checks:
    name: Source checks
    if: >-
      github.ref_type == 'branch' &&
      (inputs.lint-command != '' || inputs.typecheck-command != '' || inputs.format-check-command != '' || inputs.health-command != '' || inputs.quality-command != '' || inputs.audit-command != '')
    needs: build
    runs-on: captive-small
    timeout-minutes: 55
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-image }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}

      - name: Install dependencies
        id: install
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      # Chaque contrôle activé continue après l’échec d’un autre contrôle.
      # Une préparation ratée ou une annulation empêche leur exécution.
      - name: Lint
        if: >-
          !cancelled() && inputs.lint-command != '' &&
          (steps.npm-cache.outputs.cache-hit == 'true' || steps.install.outcome == 'success')
        timeout-minutes: 10
        run: ${{ inputs.lint-command }}

      - name: Type check
        if: >-
          !cancelled() && inputs.typecheck-command != '' &&
          (steps.npm-cache.outputs.cache-hit == 'true' || steps.install.outcome == 'success')
        timeout-minutes: 10
        run: ${{ inputs.typecheck-command }}

      - name: Format check
        if: >-
          !cancelled() && inputs.format-check-command != '' &&
          (steps.npm-cache.outputs.cache-hit == 'true' || steps.install.outcome == 'success')
        timeout-minutes: 10
        run: ${{ inputs.format-check-command }}

      - name: Health checks
        if: >-
          !cancelled() && inputs.health-command != '' &&
          (steps.npm-cache.outputs.cache-hit == 'true' || steps.install.outcome == 'success')
        timeout-minutes: 10
        run: ${{ inputs.health-command }}

      # code-multivitals n'a pas de score minimum et sort en 1 dès qu'une fonction dépasse un
      # seuil : on ignore son code de sortie et on compare le Health Score moyen de son rapport
      # au minimumHealthScore du dépôt, comme rubycritic avec minimum_score (ADR 0002).
      - name: Code quality
        if: >-
          !cancelled() && inputs.quality-command != '' &&
          (steps.npm-cache.outputs.cache-hit == 'true' || steps.install.outcome == 'success')
        timeout-minutes: 10
        env:
          QUALITY_COMMAND: ${{ inputs.quality-command }}
        run: |
          if [ ! -f .code-multivitals.json ]; then
            echo "::error::Aucun .code-multivitals.json : sans minimumHealthScore, le score n'est comparé à rien. Créez le fichier dans le dossier du projet avec au moins { \"minimumHealthScore\": <score actuel> }."
            exit 1
          fi
          MINIMUM=$(node -p 'const m = require("./.code-multivitals.json").minimumHealthScore; typeof m === "number" ? m : ""')
          if [ -z "$MINIMUM" ]; then
            echo "::error::.code-multivitals.json ne déclare pas un minimumHealthScore numérique. Ajoutez par exemple « \"minimumHealthScore\": 74 »."
            exit 1
          fi

          rm -f code-multivitals.json
          sh -c "$QUALITY_COMMAND" || true
          # Sans rapport, un outil planté passerait pour du code sain.
          if [ ! -s code-multivitals.json ]; then
            echo "::error::quality-command n'a pas écrit code-multivitals.json. Elle doit lancer code-multivitals avec « -r json -o code-multivitals.json »."
            exit 1
          fi

          node -e '
            const path = require("path");
            const report = require("./code-multivitals.json");
            const minimum = Number(process.argv[1]);
            const score = report.averageHealthScore;
            const weakest = report.files
              .flatMap((file) => file.functions.map((fn) => ({ ...fn, file: path.relative(process.cwd(), file.filePath) })))
              .sort((a, b) => a.healthScore - b.healthScore)
              .slice(0, 10);
            console.log(`Health Score moyen : ${score} (minimum : ${minimum}), ${report.totalFiles} fichiers.`);
            console.log("Fonctions les plus faibles :");
            for (const fn of weakest) console.log(`  ${fn.healthScore}  ${fn.file}:${fn.startLine}  ${fn.name}`);
            if (!(score >= minimum)) {
              console.log(`::error::Health Score moyen ${score} sous le minimum ${minimum} de .code-multivitals.json.`);
              process.exit(1);
            }
          ' "$MINIMUM"

      - name: Audit dependencies
        if: >-
          !cancelled() && inputs.audit-command != '' &&
          (steps.npm-cache.outputs.cache-hit == 'true' || steps.install.outcome == 'success')
        timeout-minutes: 10
        run: ${{ inputs.audit-command }}

  test:
    if: github.ref_type == 'branch' && inputs.test-command != ''
    needs: build
    # Jest ne touche pas au daemon Docker : même raison que le job build ci-dessus.
    runs-on: captive-small
    timeout-minutes: 20
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-image }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.jest-cache-path }}
          key: jest-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-cache-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --strict-peer-deps

      - name: Run tests
        run: ${{ inputs.test-command }}

  eas_update:
    needs: [build, source_checks, test]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.source_checks.result == 'success' || needs.source_checks.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      inputs.use-eas-update && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, inputs.eas-update-commit-prefix)
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm
    env:
      EXPO_TOKEN: ${{ secrets.expo-token }}
      EXPO_PUBLIC_APP_ENV: ${{ inputs.expo-public-app-env }}
      EAS_NO_VCS: 1

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            ${{ inputs.working-directory }}/node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-image }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: EAS Update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel ${{ inputs.eas-channel }} --message "$COMMIT_MESSAGE" --environment ${{ inputs.eas-environment }} --non-interactive

      - name: Upload Sentry sourcemaps
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry-auth-token }}
        run: npx sentry-expo-upload-sourcemaps dist

  notify_failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [build, source_checks, test, eas_update]
    runs-on: captive-small
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - name: Check Slack webhook configuration
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::La variable d'environnement SLACK_WEBHOOK_URL n'est pas configuré. Ajoutez-le dans les secrets du dépôt (Settings → Secrets). Exemple : SLACK_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz"
            exit 1
          fi
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI failed on `main` — ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                    { "title": "Commit", "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
                  ]
                }
              ]
            }
