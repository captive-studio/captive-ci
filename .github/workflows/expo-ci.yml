name: Expo CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      slack-webhook-url:
        required: false

      expo-token:
        required: false

      sentry-auth-token:
        required: false

    inputs:
      node-image:
        required: false
        type: string
        # renovate: datasource=docker depName=node
        default: node:24.18.1-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3

      lint-command:
        required: false
        type: string
        default: npm run lint

      typecheck-command:
        required: false
        type: string
        default: npm run typecheck

      test-command:
        required: false
        type: string
        default: npm run test

      format-check-command:
        required: false
        type: string
        default: npm run format:check

      health-command:
        required: false
        type: string
        default: ""

      jest-cache-path:
        required: false
        type: string
        default: .jest-cache

      install-command:
        required: false
        type: string
        default: npm ci --strict-peer-deps

      extra-cache-paths:
        required: false
        type: string
        default: ""

      audit-command:
        required: false
        type: string
        default: npx audit-ci --moderate

      use-eas-update:
        required: false
        type: boolean
        default: false

      eas-channel:
        required: false
        type: string
        default: staging

      eas-environment:
        required: false
        type: string
        default: preview

      expo-public-app-env:
        required: false
        type: string
        default: staging

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

  lint:
    if: inputs.lint-command != ''
    needs: build
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Lint
        run: ${{ inputs.lint-command }}

  typecheck:
    if: inputs.typecheck-command != ''
    needs: build
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Type check
        run: ${{ inputs.typecheck-command }}

  format:
    if: inputs.format-check-command != ''
    needs: build
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Format check
        run: ${{ inputs.format-check-command }}

  health:
    if: inputs.health-command != ''
    needs: build
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Health checks
        run: ${{ inputs.health-command }}

  test:
    if: inputs.test-command != ''
    needs: build
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Restore Jest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ inputs.jest-cache-path }}
          key: jest-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jest-cache-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --strict-peer-deps

      - name: Run tests
        run: ${{ inputs.test-command }}

  audit:
    if: inputs.audit-command != ''
    needs: build
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm

    steps:
      - name: Install tar/gzip (Alpine only)
        run: command -v apk && apk add --no-cache tar gzip || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Audit dependencies
        run: ${{ inputs.audit-command }}

  eas_update:
    if: inputs.use-eas-update && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, '🔖 Définit la version')
    needs: [build, lint, typecheck, format, health, test, audit]
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm
    env:
      EXPO_TOKEN: ${{ secrets.expo-token }}
      EXPO_PUBLIC_APP_ENV: ${{ inputs.expo-public-app-env }}
      EAS_NO_VCS: 1

    steps:
      - name: Install system dependencies (Alpine)
        run: apk add --no-cache tar gzip git

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: EAS Update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --channel ${{ inputs.eas-channel }} --message "$COMMIT_MESSAGE" --environment ${{ inputs.eas-environment }} --non-interactive

      - name: Upload Sentry sourcemaps
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry-auth-token }}
        run: npx sentry-expo-upload-sourcemaps dist

  notify_failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [build, lint, typecheck, format, health, test, audit, eas_update]
    runs-on: captive-small
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - name: Check Slack webhook configuration
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::La variable d'environnement SLACK_WEBHOOK_URL n'est pas configuré. Ajoutez-le dans les secrets du dépôt (Settings → Secrets). Exemple : SLACK_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz"
            exit 1
          fi
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI failed on `main` — ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                    { "title": "Commit", "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
                  ]
                }
              ]
            }
