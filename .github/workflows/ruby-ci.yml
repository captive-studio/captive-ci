name: Ruby CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      slack-webhook-url:
        required: false

    inputs:
      ruby-image:
        required: false
        type: string
        # renovate: datasource=docker depName=ghcr.io/captive-studio/ruby-ci
        default: ghcr.io/captive-studio/ruby-ci:4.0.6@sha256:d4955f728273335aa5dc03bb0a14b5364941154cb88652013bd2af382ec46100

      lint-command:
        required: false
        type: string
        default: rubocop -f github

      test-command:
        required: false
        type: string
        default: bundle exec rspec

      audit-command:
        required: false
        type: string
        default: bundler-audit

      smoke-command:
        required: false
        type: string
        default: ""

      quality-command:
        required: false
        type: string
        # Les chemins sont explicites : sans argument, rubycritic scanne "."
        # sans aucune exclusion, donc aussi les gems installés dans
        # vendor/bundle (BUNDLE_PATH), soit des milliers de fichiers inutiles.
        default: rubycritic --no-browser app lib

jobs:
  scan_ruby:
    if: github.ref_type == 'branch'
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Scan for known security vulnerabilities in gems
        run: ${{ inputs.audit-command }}

  lint:
    if: github.ref_type == 'branch'
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code
        run: ${{ inputs.lint-command }}

  test:
    if: github.ref_type == 'branch'
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Smoke test
        if: inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}

  quality:
    if: github.ref_type == 'branch' && inputs.quality-command != ''
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Sans minimum_score, rubycritic sort toujours en 0 : un dépôt sans seuil est vert
      # quel que soit son score. Le seuil reste la décision du dépôt, qui peut l'assumer
      # plus bas et le documenter, mais il ne doit pas pouvoir être oublié.
      - name: Vérifie qu'un seuil de qualité est déclaré
        env:
          QUALITY_COMMAND: ${{ inputs.quality-command }}
        run: |
          if printf '%s' "$QUALITY_COMMAND" | grep -qE '(^|[[:space:]])(-s|--minimum-score)([[:space:]]|=)'; then
            echo "Seuil déclaré dans quality-command."
            exit 0
          fi
          if [ ! -f .rubycritic.yml ]; then
            echo "::error::Aucun .rubycritic.yml : sans minimum_score, rubycritic ne fait jamais échouer ce job, quel que soit le score. Créez le fichier à la racine, avec au moins « minimum_score: 96 » et les « paths: » du dépôt."
            exit 1
          fi
          if ! grep -qE '^[[:space:]]*minimum_score:' .rubycritic.yml; then
            echo "::error::.rubycritic.yml ne déclare pas minimum_score : sans lui, rubycritic ne fait jamais échouer ce job. Ajoutez par exemple « minimum_score: 96 »."
            exit 1
          fi
          grep -E '^[[:space:]]*minimum_score:' .rubycritic.yml

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Analyse code quality
        run: ${{ inputs.quality-command }}

  notify_failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [scan_ruby, lint, test, quality]
    runs-on: captive-small
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - name: Check Slack webhook configuration
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::La variable d'environnement SLACK_WEBHOOK_URL n'est pas configuré. Ajoutez-le dans les secrets du dépôt (Settings → Secrets). Exemple : SLACK_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz"
            exit 1
          fi
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI failed on `main` — ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                    { "title": "Commit", "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
                  ]
                }
              ]
            }
