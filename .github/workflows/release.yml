name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: captive-small
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # captive-release crée la release juste après avoir poussé le tag : on lui laisse le temps
      # d'arriver, sinon softprops ajouterait une seconde fois les notes générées à son corps.
      - name: Check existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 12); do
            # curl et non gh : gh n'est pas garanti sur les runners captive-small. stderr reste visible.
            if curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub release notes
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
