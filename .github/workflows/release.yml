name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: captive-small
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # captive-release crée la release juste après avoir poussé le tag : on lui laisse le temps
      # d'arriver, sinon softprops ajouterait une seconde fois les notes générées à son corps.
      - name: Check existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 12); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub release notes
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
