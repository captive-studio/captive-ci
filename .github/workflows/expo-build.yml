name: Expo Build

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string # staging | production

      workflow-file:
        required: false
        type: string
        default: "" # defaults to build-{profile}.yml

      node-image:
        required: false
        type: string
        # renovate: datasource=docker depName=node
        default: node:24.20.0-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf

      install-command:
        required: false
        type: string
        default: npm ci --strict-peer-deps

      extra-cache-paths:
        required: false
        type: string
        default: ""

      expo-public-app-env:
        required: false
        type: string
        default: ""

    secrets:
      expo-token:
        required: true

      slack-webhook-url:
        required: false

jobs:
  eas_build:
    runs-on: self-hosted
    timeout-minutes: 30
    container:
      image: ${{ inputs.node-image }}
      volumes:
        - /home/runner/.npm:/root/.npm
    env:
      EXPO_TOKEN: ${{ secrets.expo-token }}
      EXPO_PUBLIC_APP_ENV: ${{ inputs.expo-public-app-env }}
      EAS_NO_VCS: 1

    steps:
      - name: Install system dependencies (Alpine)
        run: apk add --no-cache tar gzip git

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-cache
        with:
          path: |
            node_modules
            ${{ inputs.extra-cache-paths }}
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.install-command }}

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: EAS Build
        run: |
          WORKFLOW_FILE="${{ inputs.workflow-file }}"
          if [ -z "$WORKFLOW_FILE" ]; then
            WORKFLOW_FILE="build-${{ inputs.profile }}.yml"
          fi
          eas workflow:run "$WORKFLOW_FILE" --non-interactive

  notify_failure:
    if: failure()
    needs: [eas_build]
    runs-on: captive-small
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - name: Check Slack webhook configuration
        if: env.SLACK_WEBHOOK_URL != ''
        run: echo "Slack webhook configured"

      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ EAS Build failed (`${{ inputs.profile }}`) — ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Profile", "value": "${{ inputs.profile }}", "short": true },
                    { "title": "Workflow", "value": "${{ inputs.workflow-file || format('build-{0}.yml', inputs.profile) }}", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
                  ]
                }
              ]
            }
