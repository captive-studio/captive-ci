name: Expo Build

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string # staging | production

      install-command:
        required: false
        type: string
        default: npm ci --strict-peer-deps

      build-command:
        required: false
        type: string
        default: "" # e.g. "npm run build:staging" — empty skips the web build step

      node-version-file:
        required: false
        type: string
        default: .nvmrc

      slack-webhook-url:
        required: false
        type: string
        default: ""

    secrets:
      expo-token:
        required: true

      slack-webhook-url:
        required: false

jobs:
  build-android:
    name: Build Android (${{ inputs.profile }})
    runs-on: [self-hosted]
    container:
      image: ubuntu:24.04
      options: --cpus 2
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      APP_ENV: ${{ inputs.profile }}
      EXPO_TOKEN: ${{ secrets.expo-token }}
      EAS_NO_VCS: 1
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates unzip curl build-essential \
            openjdk-21-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Restore Android SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-36-buildtools-35.0.0-${{ runner.os }}

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platforms;android-36 build-tools;35.0.0 platform-tools

      - name: Restore Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-expo-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-expo-

      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build web app
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
        env:
          NODE_ENV: production

      - name: EAS Build (local, Android)
        run: npx eas-cli build --platform android --profile ${{ inputs.profile }} --local --non-interactive --output "$RUNNER_TEMP/app.aab"

      - name: EAS Submit (Android)
        run: npx eas-cli submit --platform android --profile ${{ inputs.profile }} --path "$RUNNER_TEMP/app.aab" --non-interactive

  build-ios:
    name: Build iOS (${{ inputs.profile }})
    runs-on: macos-26
    env:
      APP_ENV: ${{ inputs.profile }}
      EXPO_TOKEN: ${{ secrets.expo-token }}
      EAS_NO_VCS: 1
    concurrency:
      group: expo-build-ios-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: npm-macos-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-macos-

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build web app
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
        env:
          NODE_ENV: production

      - name: EAS Build (local, iOS)
        run: npx eas-cli build --platform ios --profile ${{ inputs.profile }} --local --non-interactive --output "$RUNNER_TEMP/app.ipa"

      - name: EAS Submit (iOS)
        run: npx eas-cli submit --platform ios --profile ${{ inputs.profile }} --path "$RUNNER_TEMP/app.ipa" --non-interactive

  notify-failure:
    if: failure()
    needs: [build-android, build-ios]
    runs-on: captive-small
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Expo Build failed (`${{ inputs.profile }}`) — ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Profile", "value": "${{ inputs.profile }}", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
                  ]
                }
              ]
            }
