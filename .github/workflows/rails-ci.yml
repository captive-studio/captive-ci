name: Rails CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      rails-master-key:
        required: false

      slack-webhook-url:
        required: false

    inputs:
      ruby-image:
        required: false
        type: string
        # renovate: datasource=docker depName=ghcr.io/captive-studio/ruby-ci
        default: ghcr.io/captive-studio/ruby-ci:4.0.6@sha256:43c38d37141dcca9a08ee1e0fb29ec2c6db7b9beed390aedd9c6d99f83495368

      rails-image:
        required: false
        type: string
        # renovate: datasource=docker depName=ghcr.io/captive-studio/rails-ci
        default: ghcr.io/captive-studio/rails-ci:4.0.6@sha256:4b523390778dfe005b3d1368e22e967894a247d8382eabdde62489d3682573b3

      lint-command:
        required: false
        type: string
        default: rubocop -f github

      audit-command:
        required: false
        type: string
        default: bundler-audit

      brakeman-command:
        required: false
        type: string
        default: brakeman -q

      quality-command:
        required: false
        type: string
        # Les chemins sont explicites : sans argument, rubycritic scanne "."
        # sans aucune exclusion, donc aussi les gems installés dans
        # vendor/bundle (BUNDLE_PATH), soit des milliers de fichiers inutiles.
        default: rubycritic --no-browser app lib

      js-audit-command:
        required: false
        type: string
        default: ""

      test-command:
        required: false
        type: string
        default: bundle exec rspec

      smoke-command:
        required: false
        type: string
        default: ""

      assets-build-command:
        required: false
        type: string
        default: ""

      # postgres et redis tournent en service dans test/system_test pour toutes les apps
      # (GitHub Actions ne permet pas de service conditionnel par job) ; run-db-setup ne
      # pilote que l'exécution de db-setup-command, pas le démarrage du service postgres.
      run-db-setup:
        required: false
        type: boolean
        default: true

      postgres-image:
        required: false
        type: string
        # renovate: datasource=docker depName=postgres
        default: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941

      database-url:
        required: false
        type: string
        default: postgresql://postgres:postgres@postgres/postgres

      db-setup-command:
        required: false
        type: string
        default: bin/rails db:create db:schema:load

      redis-image:
        required: false
        type: string
        # renovate: datasource=docker depName=redis
        default: redis:8@sha256:691577adaf11927f4bb8871d40a5dd69a5c300d4453b742e8f6383c3e6e8d2e1

      use-system-tests:
        required: false
        type: boolean
        default: false

      system-test-command:
        required: false
        type: string
        default: bundle exec rspec spec/system

      # db-setup-command charge le schéma (db:schema:load) pour aller vite dans le job
      # test ; use-migration-check ajoute un job séparé qui rejoue l'historique complet
      # des migrations (db:migrate), pour détecter une migration cassée que schema:load
      # contournerait silencieusement.
      use-migration-check:
        required: false
        type: boolean
        default: false

      migrate-command:
        required: false
        type: string
        default: bin/rails db:create db:migrate

      seed-command:
        required: false
        type: string
        default: bin/rails db:seed

jobs:
  scan_ruby:
    if: github.ref_type == 'branch'
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Scan for known security vulnerabilities in gems
        run: ${{ inputs.audit-command }}

      - name: Scan for Rails-specific security vulnerabilities
        run: ${{ inputs.brakeman-command }}

  lint:
    if: github.ref_type == 'branch'
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code
        run: ${{ inputs.lint-command }}

  quality:
    if: github.ref_type == 'branch' && inputs.quality-command != ''
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Analyse code quality
        run: ${{ inputs.quality-command }}

  scan_js:
    if: github.ref_type == 'branch' && inputs.js-audit-command != ''
    runs-on: captive-small
    timeout-minutes: 10
    container:
      image: ${{ inputs.ruby-image }}
    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: ${{ inputs.js-audit-command }}

  test:
    if: github.ref_type == 'branch'
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ inputs.rails-image }}
    env:
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
      DATABASE_URL: ${{ inputs.database-url }}
      RAILS_MASTER_KEY: ${{ secrets.rails-master-key }}

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ inputs.redis-image }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Setup Node
        if: inputs.assets-build-command != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Build assets
        if: inputs.assets-build-command != ''
        run: ${{ inputs.assets-build-command }}

      - name: Setup database
        if: inputs.run-db-setup
        run: ${{ inputs.db-setup-command }}

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Smoke test
        if: inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}

  system_test:
    if: github.ref_type == 'branch' && inputs.use-system-tests
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ inputs.rails-image }}
    env:
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
      DATABASE_URL: ${{ inputs.database-url }}
      RAILS_MASTER_KEY: ${{ secrets.rails-master-key }}

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ inputs.redis-image }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Setup Node
        if: inputs.assets-build-command != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Build assets
        if: inputs.assets-build-command != ''
        run: ${{ inputs.assets-build-command }}

      - name: Setup database
        if: inputs.run-db-setup
        run: ${{ inputs.db-setup-command }}

      - name: Run system tests
        run: ${{ inputs.system-test-command }}

  migrate:
    if: github.ref_type == 'branch' && inputs.use-migration-check
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ inputs.rails-image }}
    env:
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
      DATABASE_URL: ${{ inputs.database-url }}
      RAILS_MASTER_KEY: ${{ secrets.rails-master-key }}

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ inputs.redis-image }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Install dependencies
        run: bundle install --quiet

      - name: Run migrations from scratch
        run: ${{ inputs.migrate-command }}

      - name: Seed database
        run: ${{ inputs.seed-command }}

  notify_failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [scan_ruby, lint, quality, scan_js, test, system_test, migrate]
    runs-on: captive-small
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
    steps:
      - name: Check Slack webhook configuration
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::La variable d'environnement SLACK_WEBHOOK_URL n'est pas configuré. Ajoutez-le dans les secrets du dépôt (Settings → Secrets). Exemple : SLACK_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz"
            exit 1
          fi
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI failed on `main` — ${{ github.repository }}",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Workflow", "value": "${{ github.workflow }}", "short": true },
                    { "title": "Commit", "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
                  ]
                }
              ]
            }
