name: Release Gem

on:
  workflow_call:
    inputs:
      ruby-version:
        description: "Ruby version to use (par défaut, lue depuis .ruby-version/.tool-versions du projet)"
        type: string
        default: "default"
      homebrew-tap:
        description: "Homebrew tap to update (e.g. captive-studio/tap), optional"
        type: string
        default: ""
      homebrew-formula:
        description: "Formula name in the tap, optional"
        type: string
        default: ""
    secrets:
      RUBYGEMS_API_KEY:
        description: "RubyGems API key with push access"
        required: true
      HOMEBREW_TAP_TOKEN:
        description: "GitHub PAT with write access to the Homebrew tap repo"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  release-gem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true

      - name: Publish to RubyGems
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${RUBYGEMS_API_KEY}\n" > $HOME/.gem/credentials
          gem build *.gemspec
          gem push *.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

      - name: Publish to GPR
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
          gem build *.gemspec
          gem push --KEY github --host https://rubygems.pkg.github.com/${OWNER} *.gem
        env:
          GEM_HOST_API_KEY: "Bearer ${{ github.token }}"
          OWNER: ${{ github.repository_owner }}

      - name: Update Homebrew tap
        if: ${{ inputs.homebrew-tap != '' && inputs.homebrew-formula != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          GEM_NAME=$(basename ${{ inputs.homebrew-formula }})
          URL="https://rubygems.org/gems/${GEM_NAME}-${VERSION_NUM}.gem"
          SHA256=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/captive-studio/homebrew-${{ inputs.homebrew-tap }}.git" tap-repo
          cd tap-repo
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/${{ inputs.homebrew-formula }}.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/${{ inputs.homebrew-formula }}.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/${{ inputs.homebrew-formula }}.rb
          git commit -m "🔖 Met à jour ${{ inputs.homebrew-formula }} ${VERSION}"
          git push
